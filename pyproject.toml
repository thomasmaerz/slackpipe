[project]
name = "slackpipe"
version = "0.1.0"
description = "Dagster OSS orchestration scaffolding for Slackpipe"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster==1.13.20",
    "duckdb>=1.4,<2",
]

[dependency-groups]
dev = [
    "dagster-dg-cli==1.13.20",
    "pytest>=8,<10",
]

[project.optional-dependencies]
deployment = [
    "dagster-postgres==0.29.20",
    "dagster-webserver==1.13.20",
]
dev = [
    "dagster-dg-cli==1.13.20",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.19"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slackpipe"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "slackpipe"
code_location_name = "slackpipe"
registry_modules = [
    "slackpipe.components.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
