storage:
  postgres:
    postgres_db:
      hostname: postgres
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config: {}

concurrency:
  pools:
    default_limit: 1
    granularity: op
  runs:
    # Global slots shared by all lanes. Bump when adding a lane so the
    # per-lane limits below always leave every lane a free slot.
    max_concurrent_runs: 4
    tag_concurrency_limits:
      - key: slackpipe/phase
        value: "raw"
        limit: 2
      - key: slackpipe/phase
        value: "canonical"
        limit: 1
      - key: slackpipe/serial
        value: "true"
        limit: 1
      # Concurrency lanes: every job must carry a `lane` tag so one
      # team's runs can never starve another team's queue slots, no
      # matter how long a single run takes. Add a `lane: <team>` entry
      # here for any future lane.
      - key: lane
        value: "slackpipe"
        limit: 3
      - key: lane
        value: "slackquery"
        limit: 1

run_monitoring:
  enabled: true
  poll_interval_seconds: 15
  cancel_timeout_seconds: 300
  free_slots_after_run_end_seconds: 60

sensors:
  use_threads: true
  num_workers: 2

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /var/lib/dagster/artifacts

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /var/lib/dagster/compute-logs

telemetry:
  enabled: false

nux:
  enabled: false
